name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同时给 build 与 deploy 所需权限：
#  - contents: write          签出/可选推送
#  - pages: write             写入 GitHub Pages（部分新版 actions 需要）
#  - id-token: write          关键：让 actions/deploy-pages@v4 拿到 OIDC token，
#                              才能向 github-pages 环境发布
permissions:
  contents: write
  pages: write
  id-token: write

# 同名仓库（同 org 下的 user/org page）只需要一份部署；
# 这里开 concurrency 保证不会出现两次部署同时跑，导致 gh-pages 内容错乱。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # GitHub 自 2025 起逐步弃用 Node 20 runner；用 LTS Node 22
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite 默认产物目录
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 当 workflow 显式声明 environment + deployment 步骤时，部署输出会作为
    # GitHub Pages 的官方 "deployment"，从而真正对外发布
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
